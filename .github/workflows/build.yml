name: Build Mod JAR
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Official Fabric 1.21 Template
        run: |
          rm -rf * .github .gitignore .gradle || true
          git clone -b 1.21 https://github.com/FabricMC/fabric-example-mod.git .

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Inject Literal Screen Recorder for 1.21.11
        run: |
          rm -rf src/main/java
          rm -rf src/client/java
          mkdir -p src/client/java/com/literalscreenrecorder

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.6
          loader_version=0.18.4
          mod_version=1.0.0
          maven_group=com.literalscreenrecorder
          archives_base_name=literal-screen-recorder
          fabric_version=0.141.5+1.21.11
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }
          version = project.mod_version
          group = project.maven_group
          base {
              archivesName = project.archives_base_name
          }
          loom {
              splitEnvironmentSourceSets()
              mods {
                  "literal-screen-recorder" {
                      sourceSet sourceSets.main
                      sourceSet sourceSets.client
                  }
              }
          }
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }
          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "literal-screen-recorder",
            "version": "${version}",
            "name": "Literal Screen Recorder",
            "description": "Zero-lag async FFmpeg screen recorder and instant replay buffer.",
            "authors": ["You"],
            "license": "CC0-1.0",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.literalscreenrecorder.LiteralScreenRecorderClient"
              ]
            },
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat << 'EOF' > src/client/java/com/literalscreenrecorder/LiteralScreenRecorderClient.java
          package com.literalscreenrecorder;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
          import net.fabricmc.loader.api.FabricLoader;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.input.KeyInput;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.client.util.Window;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;
          import net.minecraft.util.Identifier;
          import org.lwjgl.BufferUtils;
          import org.lwjgl.glfw.GLFW;
          import org.lwjgl.opengl.GL11;
          import org.lwjgl.opengl.GL12;

          import java.io.*;
          import java.nio.ByteBuffer;
          import java.text.SimpleDateFormat;
          import java.util.*;
          import java.util.concurrent.*;

          public class LiteralScreenRecorderClient implements ClientModInitializer {
              public static KeyBinding openGuiKey;
              private boolean wasStartStopPressed = false;
              private boolean wasClipPressed = false;
              private static long lastCaptureTimeNs = 0;

              @Override
              public void onInitializeClient() {
                  RecorderConfig.load();

                  KeyBinding.Category category = KeyBinding.Category.create(Identifier.of("literal-screen-recorder", "general"));
                  openGuiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "Open Recorder GUI",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_N,
                          category
                  ));

                  // Capture framebuffer at the end of HUD rendering on a background-piped thread
                  HudElementRegistry.addLast(Identifier.of("literal-screen-recorder", "frame_capture"), (context, tickCounter) -> {
                      RecorderConfig cfg = RecorderConfig.INSTANCE;
                      if (!cfg.isRecording && !cfg.replayBufferEnabled) return;

                      long now = System.nanoTime();
                      long frameIntervalNs = 1_000_000_000L / cfg.fps;
                      if (now - lastCaptureTimeNs < frameIntervalNs) return;
                      lastCaptureTimeNs = now;

                      AsyncVideoEngine.captureFrame();
                  });

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      if (client.player == null || client.getWindow() == null) return;

                      while (openGuiKey.wasPressed()) {
                          client.setScreen(new RecorderScreen(client.currentScreen));
                      }

                      if (client.currentScreen != null) return;

                      Window window = client.getWindow();
                      RecorderConfig cfg = RecorderConfig.INSTANCE;

                      if (cfg.startStopKey != GLFW.GLFW_KEY_UNKNOWN) {
                          boolean isPressed = InputUtil.isKeyPressed(window, cfg.startStopKey);
                          if (isPressed && !wasStartStopPressed) {
                              toggleRecording();
                          }
                          wasStartStopPressed = isPressed;
                      }

                      if (cfg.clipKey != GLFW.GLFW_KEY_UNKNOWN) {
                          boolean isPressed = InputUtil.isKeyPressed(window, cfg.clipKey);
                          if (isPressed && !wasClipPressed) {
                              saveClip();
                          }
                          wasClipPressed = isPressed;
                      }
                  });

                  Runtime.getRuntime().addShutdownHook(new Thread(AsyncVideoEngine::shutdown));
              }

              public static void toggleRecording() {
                  RecorderConfig cfg = RecorderConfig.INSTANCE;
                  MinecraftClient client = MinecraftClient.getInstance();

                  if (!cfg.isRecording) {
                      if (!AsyncVideoEngine.isFfmpegAvailable()) {
                          if (client.player != null) {
                              client.player.sendMessage(Text.literal("✖ [Literal Recorder] FFmpeg not found! Install FFmpeg to PATH.").formatted(Formatting.RED), false);
                          }
                          return;
                      }
                      cfg.isRecording = true;
                      AsyncVideoEngine.startDirectRecording();
                      if (client.player != null) {
                          client.player.sendMessage(Text.literal("● [Literal Recorder] Recording Started (" + cfg.quality + " @ " + cfg.fps + " FPS)").formatted(Formatting.GREEN), true);
                      }
                  } else {
                      cfg.isRecording = false;
                      AsyncVideoEngine.stopDirectRecording();
                      if (client.player != null) {
                          client.player.sendMessage(Text.literal("■ [Literal Recorder] Saved to /recordings folder!").formatted(Formatting.RED), true);
                      }
                  }
              }

              public static void saveClip() {
                  MinecraftClient client = MinecraftClient.getInstance();
                  RecorderConfig cfg = RecorderConfig.INSTANCE;

                  if (!AsyncVideoEngine.isFfmpegAvailable()) {
                      if (client.player != null) {
                          client.player.sendMessage(Text.literal("✖ [Literal Recorder] FFmpeg not found! Install FFmpeg to PATH.").formatted(Formatting.RED), false);
                      }
                      return;
                  }

                  AsyncVideoEngine.flushReplayBufferToDisk();
                  if (client.player != null) {
                      String timeLabel = cfg.clipDuration == 60 ? "1 minute" : cfg.clipDuration + " seconds";
                      client.player.sendMessage(Text.literal("★ [Literal Recorder] Saving clip of last " + timeLabel + "...").formatted(Formatting.AQUA), true);
                  }
              }

              public static class AsyncVideoEngine {
                  private static final ExecutorService ENCODE_EXECUTOR = Executors.newFixedThreadPool(2, r -> {
                      Thread t = new Thread(r, "LiteralRecorder-Encoder");
                      t.setDaemon(true);
                      return t;
                  });

                  private static final ArrayDeque<byte[]> REPLAY_RING = new ArrayDeque<>();
                  private static int ringWidth = 0;
                  private static int ringHeight = 0;
                  private static Process activeProcess = null;
                  private static OutputStream activeStdin = null;
                  private static ByteBuffer readBuffer = null;
                  private static Boolean ffmpegChecked = null;
                  private static String detectedEncoder = null;

                  public static boolean isFfmpegAvailable() {
                      if (ffmpegChecked != null) return ffmpegChecked;
                      try {
                          Process p = new ProcessBuilder("ffmpeg", "-version").start();
                          ffmpegChecked = (p.waitFor() == 0);
                          if (ffmpegChecked) detectBestHardwareEncoder();
                      } catch (Exception e) {
                          ffmpegChecked = false;
                      }
                      return ffmpegChecked;
                  }

                  private static void detectBestHardwareEncoder() {
                      try {
                          Process p = new ProcessBuilder("ffmpeg", "-hide_banner", "-encoders").start();
                          String out = new String(p.getInputStream().readAllBytes());
                          p.waitFor();
                          if (out.contains("h264_nvenc")) detectedEncoder = "h264_nvenc";
                          else if (out.contains("h264_amf")) detectedEncoder = "h264_amf";
                          else if (out.contains("h264_qsv")) detectedEncoder = "h264_qsv";
                          else detectedEncoder = "libx264";
                      } catch (Exception e) {
                          detectedEncoder = "libx264";
                      }
                  }

                  public static void captureFrame() {
                      MinecraftClient client = MinecraftClient.getInstance();
                      if (client.getWindow() == null) return;

                      int width = client.getWindow().getFramebufferWidth();
                      int height = client.getWindow().getFramebufferHeight();
                      if (width <= 0 || height <= 0) return;

                      // Ensure even dimensions for H.264 yuv420p
                      int evenW = width & ~1;
                      int evenH = height & ~1;
                      int byteSize = evenW * evenH * 3;

                      if (readBuffer == null || readBuffer.capacity() < byteSize) {
                          readBuffer = BufferUtils.createByteBuffer(byteSize);
                      }
                      readBuffer.clear();

                      GL11.glPixelStorei(GL11.GL_PACK_ALIGNMENT, 1);
                      GL11.glReadPixels(0, 0, evenW, evenH, GL12.GL_BGR, GL11.GL_UNSIGNED_BYTE, readBuffer);

                      byte[] frameData = new byte[byteSize];
                      readBuffer.get(frameData);

                      RecorderConfig cfg = RecorderConfig.INSTANCE;

                      // 1. Push to Replay Ring Buffer if enabled
                      if (cfg.replayBufferEnabled) {
                          synchronized (REPLAY_RING) {
                              if (ringWidth != evenW || ringHeight != evenH) {
                                  REPLAY_RING.clear();
                                  ringWidth = evenW;
                                  ringHeight = evenH;
                              }
                              int maxFrames = cfg.clipDuration * cfg.fps;
                              while (REPLAY_RING.size() >= maxFrames) {
                                  REPLAY_RING.pollFirst();
                              }
                              REPLAY_RING.addLast(frameData);
                          }
                      }

                      // 2. Stream directly to active FFmpeg recording pipe asynchronously
                      if (cfg.isRecording && activeStdin != null) {
                          final OutputStream stream = activeStdin;
                          ENCODE_EXECUTOR.submit(() -> {
                              try {
                                  stream.write(frameData);
                              } catch (IOException ignored) {}
                          });
                      }
                  }

                  public static void startDirectRecording() {
                      MinecraftClient client = MinecraftClient.getInstance();
                      int w = client.getWindow().getFramebufferWidth() & ~1;
                      int h = client.getWindow().getFramebufferHeight() & ~1;
                      File outFile = getOutputFile("recording");

                      ENCODE_EXECUTOR.submit(() -> {
                          try {
                              activeProcess = buildFfmpegProcess(w, h, RecorderConfig.INSTANCE.fps, outFile);
                              activeStdin = new BufferedOutputStream(activeProcess.getOutputStream(), 1024 * 1024 * 4);
                          } catch (IOException e) {
                              RecorderConfig.INSTANCE.isRecording = false;
                          }
                      });
                  }

                  public static void stopDirectRecording() {
                      final Process proc = activeProcess;
                      final OutputStream stdin = activeStdin;
                      activeProcess = null;
                      activeStdin = null;

                      ENCODE_EXECUTOR.submit(() -> {
                          try {
                              if (stdin != null) {
                                  stdin.flush();
                                  stdin.close();
                              }
                              if (proc != null) proc.waitFor(10, TimeUnit.SECONDS);
                          } catch (Exception ignored) {}
                      });
                  }

                  public static void flushReplayBufferToDisk() {
                      final List<byte[]> snapshot;
                      final int w;
                      final int h;
                      synchronized (REPLAY_RING) {
                          if (REPLAY_RING.isEmpty()) return;
                          snapshot = new ArrayList<>(REPLAY_RING);
                          w = ringWidth;
                          h = ringHeight;
                      }

                      final int fps = RecorderConfig.INSTANCE.fps;
                      final File outFile = getOutputFile("clip");

                      ENCODE_EXECUTOR.submit(() -> {
                          try {
                              Process proc = buildFfmpegProcess(w, h, fps, outFile);
                              try (OutputStream out = new BufferedOutputStream(proc.getOutputStream(), 1024 * 1024 * 4)) {
                                  for (byte[] frame : snapshot) {
                                      out.write(frame);
                                  }
                                  out.flush();
                              }
                              proc.waitFor(15, TimeUnit.SECONDS);
                              MinecraftClient mc = MinecraftClient.getInstance();
                              mc.execute(() -> {
                                  if (mc.player != null) {
                                      mc.player.sendMessage(Text.literal("✔ [Literal Recorder] Clip saved: " + outFile.getName()).formatted(Formatting.GREEN), true);
                                  }
                              });
                          } catch (Exception ignored) {}
                      });
                  }

                  private static Process buildFfmpegProcess(int width, int height, int fps, File outputFile) throws IOException {
                      String encoder = detectedEncoder != null ? detectedEncoder : "libx264";
                      String crf = switch (RecorderConfig.INSTANCE.quality) {
                          case "Low" -> "28";
                          case "Medium" -> "23";
                          case "High" -> "18";
                          default -> "14"; // Ultra
                      };

                      List<String> cmd = new ArrayList<>(List.of(
                              "ffmpeg", "-y",
                              "-f", "rawvideo",
                              "-vcodec", "rawvideo",
                              "-pix_fmt", "bgr24",
                              "-s", width + "x" + height,
                              "-r", String.valueOf(fps),
                              "-i", "-",
                              "-vf", "vflip",
                              "-c:v", encoder
                      ));

                      if ("libx264".equals(encoder)) {
                          cmd.addAll(List.of("-preset", "ultrafast", "-crf", crf));
                      } else {
                          cmd.addAll(List.of("-preset", "p1", "-cq", crf));
                      }

                      cmd.addAll(List.of("-pix_fmt", "yuv420p", outputFile.getAbsolutePath()));

                      ProcessBuilder pb = new ProcessBuilder(cmd);
                      pb.redirectErrorStream(true);
                      Process p = pb.start();
                      // Drain FFmpeg stdout/stderr so buffer never blocks
                      Thread drain = new Thread(() -> {
                          try (InputStream is = p.getInputStream()) {
                              is.transferTo(OutputStream.nullOutputStream());
                          } catch (IOException ignored) {}
                      });
                      drain.setDaemon(true);
                      drain.start();
                      return p;
                  }

                  private static File getOutputFile(String prefix) {
                      File dir = new File(MinecraftClient.getInstance().runDirectory, "recordings");
                      if (!dir.exists()) dir.mkdirs();
                      String stamp = new SimpleDateFormat("yyyy-MM-dd_HH-mm-ss").format(new Date());
                      return new File(dir, prefix + "_" + stamp + ".mp4");
                  }

                  public static void shutdown() {
                      if (RecorderConfig.INSTANCE.isRecording) {
                          stopDirectRecording();
                      }
                      ENCODE_EXECUTOR.shutdownNow();
                  }
              }

              public static class RecorderConfig {
                  private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
                  private static final File CONFIG_FILE = new File(FabricLoader.getInstance().getConfigDir().toFile(), "literal_screen_recorder.json");
                  public static RecorderConfig INSTANCE = new RecorderConfig();

                  public int clipDuration = 15;
                  public String quality = "High";
                  public int fps = 60;
                  public boolean replayBufferEnabled = false;
                  public int startStopKey = GLFW.GLFW_KEY_UNKNOWN;
                  public int clipKey = GLFW.GLFW_KEY_UNKNOWN;
                  public transient boolean isRecording = false;

                  public static void load() {
                      if (CONFIG_FILE.exists()) {
                          try (FileReader reader = new FileReader(CONFIG_FILE)) {
                              RecorderConfig loaded = GSON.fromJson(reader, RecorderConfig.class);
                              if (loaded != null) INSTANCE = loaded;
                          } catch (IOException ignored) {}
                      } else {
                          save();
                      }
                  }

                  public static void save() {
                      try (FileWriter writer = new FileWriter(CONFIG_FILE)) {
                          GSON.toJson(INSTANCE, writer);
                      } catch (IOException ignored) {}
                  }

                  public void cycleClipDuration() {
                      clipDuration = (clipDuration == 15) ? 30 : (clipDuration == 30 ? 60 : 15);
                      save();
                  }

                  public void cycleQuality() {
                      quality = switch (quality) {
                          case "Low" -> "Medium";
                          case "Medium" -> "High";
                          case "High" -> "Ultra";
                          default -> "Low";
                      };
                      save();
                  }

                  public void cycleFps() {
                      fps = (fps == 30) ? 60 : (fps == 60 ? 120 : 30);
                      save();
                  }
              }

              public static class RecorderScreen extends Screen {
                  private final Screen parent;
                  private int listeningForKey = 0;
                  private ButtonWidget clipBtn, bindStartStopBtn, bindClipBtn;

                  public RecorderScreen(Screen parent) {
                      super(Text.literal("Literal Screen Recorder"));
                      this.parent = parent;
                  }

                  @Override
                  protected void init() {
                      RecorderConfig cfg = RecorderConfig.INSTANCE;
                      int centerX = this.width / 2;
                      int startY = this.height / 2 - 80;

                      ButtonWidget startStopBtn = ButtonWidget.builder(getRecordButtonText(), btn -> {
                          toggleRecording();
                          btn.setMessage(getRecordButtonText());
                      }).dimensions(centerX - 155, startY, 150, 20).build();

                      clipBtn = ButtonWidget.builder(Text.literal("Save Last " + getDurationLabel(cfg.clipDuration)).formatted(Formatting.AQUA), btn -> saveClip())
                              .dimensions(centerX + 5, startY, 150, 20).build();

                      ButtonWidget replayToggleBtn = ButtonWidget.builder(getReplayBufferText(), btn -> {
                          cfg.replayBufferEnabled = !cfg.replayBufferEnabled;
                          cfg.save();
                          btn.setMessage(getReplayBufferText());
                      }).dimensions(centerX - 155, startY + 26, 310, 20).build();

                      ButtonWidget durationBtn = ButtonWidget.builder(Text.literal("Clip Length: " + getDurationLabel(cfg.clipDuration)), btn -> {
                          cfg.cycleClipDuration();
                          btn.setMessage(Text.literal("Clip Length: " + getDurationLabel(cfg.clipDuration)));
                          clipBtn.setMessage(Text.literal("Save Last " + getDurationLabel(cfg.clipDuration)).formatted(Formatting.AQUA));
                      }).dimensions(centerX - 155, startY + 52, 150, 20).build();

                      ButtonWidget qualityBtn = ButtonWidget.builder(Text.literal("Quality: " + cfg.quality), btn -> {
                          cfg.cycleQuality();
                          btn.setMessage(Text.literal("Quality: " + cfg.quality));
                      }).dimensions(centerX + 5, startY + 52, 150, 20).build();

                      ButtonWidget fpsBtn = ButtonWidget.builder(Text.literal("Target FPS: " + cfg.fps), btn -> {
                          cfg.cycleFps();
                          btn.setMessage(Text.literal("Target FPS: " + cfg.fps));
                      }).dimensions(centerX - 75, startY + 78, 150, 20).build();

                      bindStartStopBtn = ButtonWidget.builder(getKeybindText("Start/Stop Key", cfg.startStopKey, 1), btn -> {
                          listeningForKey = (listeningForKey == 1) ? 0 : 1;
                          updateKeybindButtons();
                      }).dimensions(centerX - 155, startY + 118, 150, 20).build();

                      bindClipBtn = ButtonWidget.builder(getKeybindText("Clip Key", cfg.clipKey, 2), btn -> {
                          listeningForKey = (listeningForKey == 2) ? 0 : 2;
                          updateKeybindButtons();
                      }).dimensions(centerX + 5, startY + 118, 150, 20).build();

                      ButtonWidget doneBtn = ButtonWidget.builder(Text.literal("Done"), btn -> this.close())
                              .dimensions(centerX - 50, startY + 150, 100, 20).build();

                      this.addDrawableChild(startStopBtn);
                      this.addDrawableChild(clipBtn);
                      this.addDrawableChild(replayToggleBtn);
                      this.addDrawableChild(durationBtn);
                      this.addDrawableChild(qualityBtn);
                      this.addDrawableChild(fpsBtn);
                      this.addDrawableChild(bindStartStopBtn);
                      this.addDrawableChild(bindClipBtn);
                      this.addDrawableChild(doneBtn);
                  }

                  private Text getRecordButtonText() {
                      return RecorderConfig.INSTANCE.isRecording
                              ? Text.literal("■ Stop Recording").formatted(Formatting.RED)
                              : Text.literal("● Start Recording").formatted(Formatting.GREEN);
                  }

                  private Text getReplayBufferText() {
                      return RecorderConfig.INSTANCE.replayBufferEnabled
                              ? Text.literal("Replay Buffer: ON (Background Clipping)").formatted(Formatting.GREEN)
                              : Text.literal("Replay Buffer: OFF").formatted(Formatting.GRAY);
                  }

                  private String getDurationLabel(int sec) {
                      return sec == 60 ? "1 Min" : sec + " Sec";
                  }

                  private Text getKeybindText(String label, int keyCode, int buttonId) {
                      if (listeningForKey == buttonId) return Text.literal(label + ": > Press Key <").formatted(Formatting.YELLOW);
                      if (keyCode == GLFW.GLFW_KEY_UNKNOWN) return Text.literal(label + ": Not Bound").formatted(Formatting.GRAY);
                      return Text.literal(label + ": " + InputUtil.fromKeyCode(new KeyInput(keyCode, 0, 0)).getLocalizedText().getString());
                  }

                  private void updateKeybindButtons() {
                      RecorderConfig cfg = RecorderConfig.INSTANCE;
                      bindStartStopBtn.setMessage(getKeybindText("Start/Stop Key", cfg.startStopKey, 1));
                      bindClipBtn.setMessage(getKeybindText("Clip Key", cfg.clipKey, 2));
                  }

                  @Override
                  public boolean keyPressed(KeyInput input) {
                      if (listeningForKey != 0) {
                          int keyCode = input.key();
                          int newKey = (keyCode == GLFW.GLFW_KEY_ESCAPE) ? GLFW.GLFW_KEY_UNKNOWN : keyCode;
                          if (listeningForKey == 1) RecorderConfig.INSTANCE.startStopKey = newKey;
                          else if (listeningForKey == 2) RecorderConfig.INSTANCE.clipKey = newKey;
                          listeningForKey = 0;
                          RecorderConfig.save();
                          updateKeybindButtons();
                          return true;
                      }
                      return super.keyPressed(input);
                  }

                  @Override
                  public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                      super.render(context, mouseX, mouseY, delta);
                      int centerX = this.width / 2;
                      int startY = this.height / 2 - 80;
                      context.drawCenteredTextWithShadow(this.textRenderer, "Literal Screen Recorder (1.21.11)", centerX, startY - 22, 0xFFFFFF);
                      context.drawCenteredTextWithShadow(this.textRenderer, "Hotkeys (Press ESC to unbind)", centerX, startY + 104, 0xAAAAAA);
                  }

                  @Override
                  public void close() {
                      RecorderConfig.save();
                      if (this.client != null) this.client.setScreen(this.parent);
                  }
              }
          }
          EOF

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build -x test

      - name: Upload Compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Literal-Screen-Recorder-Mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
